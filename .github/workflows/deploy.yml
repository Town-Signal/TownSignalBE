name: Backend Deploy

# AWS(ECR/EC2/DB) 준비 전이라 당분간 수동 실행만 가능하도록 해둠.
# 인프라/시크릿 세팅 끝나면 트리거를 `push: branches: [ main ]`으로 바꿔서 자동 배포로 전환할 것.
on:
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: townsignal-be
  CONTAINER_NAME: townsignal-be

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # application-dev.yml / application-prod.yml은 민감정보가 담겨 있어 git에 올리지 않고
      # GitHub Secrets(Base64 인코딩)로 관리 - 빌드 전에 복원해서 이미지에 포함시킨다.
      - name: Restore application-dev.yml
        run: echo "${{ secrets.APP_PROPERTIES_DEV }}" | base64 --decode > src/main/resources/application-dev.yml

      - name: Restore application-prod.yml
        run: echo "${{ secrets.APP_PROPERTIES_PROD }}" | base64 --decode > src/main/resources/application-prod.yml

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # EC2에는 Access Key를 두지 않는다 - 인스턴스에 IAM Role(ECR Pull 권한)을 붙여서
      # 그 역할로 자동 인증되도록 한다 (서버 탈취 시 자격증명 유출 방지).
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            docker rm -f ${{ env.CONTAINER_NAME }} || true

            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            docker run -d -p 8080:8080 --name ${{ env.CONTAINER_NAME }} \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e TZ=Asia/Seoul \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

            docker image prune -f
