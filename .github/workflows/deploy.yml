name: Backend Deploy

# AWS(EC2/DB) 준비 전이라 당분간 수동 실행만 가능하도록 해둠.
# EC2/시크릿 세팅 끝나면 아래를 `push: branches: [ main ]`으로 바꿔서 자동 배포로 전환할 것.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/backend"
          strip_components: 2

      - name: Run Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            fuser -k 8080/tcp || true
            cd /home/ec2-user/backend
            nohup java -jar \
              -Dspring.profiles.active=prod \
              -DDB_URL="${{ secrets.DB_URL }}" \
              -DDB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -DDB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -DREDIS_HOST="${{ secrets.REDIS_HOST }}" \
              -DREDIS_PORT="${{ secrets.REDIS_PORT }}" \
              *.jar > log.txt 2>&1 &
